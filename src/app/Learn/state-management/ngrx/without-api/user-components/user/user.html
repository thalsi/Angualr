<div class="container">

  <h1>User CRUD</h1>


  <!-- ADD -->

  <button
    type="button"
    (click)="add()">

    Add User

  </button>


  <hr>


  <!-- READ -->

  @if (users$ | async; as users) {

    @if (users.length === 0) {

      <p>
        No users found.
      </p>

    }


    @for (user of users; track user.id) {

      <div class="user">

        <h3>
          {{ user.name }}
        </h3>


        <p>
          {{ user.email }}
        </p>


        <!-- UPDATE -->

        <button
          type="button"
          (click)="edit(user)">

          Edit

        </button>


        <!-- DELETE -->

        <button
          type="button"
          (click)="delete(user.id)">

          Delete

        </button>

      </div>

    }

  }

</div>
