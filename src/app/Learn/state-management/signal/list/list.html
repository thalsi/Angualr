<h2>Users</h2>

@if (userState.loading()) {

  <p>Loading...</p>

}

@if (userState.error()) {

  <p>
    {{ userState.error() }}
  </p>

}

@for (user of userState.users(); track user.id) {

  <div>

    <strong>
      {{ user.name }}
    </strong>

    <span>
      {{ user.email }}
    </span>

    <button
      (click)="deleteUser(user.id)">
      Delete
    </button>

  </div>

}
